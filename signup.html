<!DOCTYPE html>
<html lang="en">

<head>

</head>

<body>

<nav>

<h2>Sunqora AI</h2>

<div class="nav-links">

<a href="index.html">Home</a>

</div>

</nav>

<section class="login-box">

<h1>Create Your Account 🚀</h1>

<p>
Join Sunqora AI and start creating with one prompt.
</p>

<form>

<input
type="text"
placeholder="Full Name"
required>

<input
type="email"
placeholder="Email Address"
required>

<input
type="password"
placeholder="Create Password"
required>

<input
type="password"
placeholder="Confirm Password"
required>

<label class="terms">

<input type="checkbox" required>

I agree to the Terms of Service and Privacy Policy.

</label>

<button type="submit">

Create Account

</button>

</form>

<p class="login-links">

Already have an account?

<a href="login.html">

Sign In

</a>

</p>

</section>

<script src="script.js"></script>

</body>
